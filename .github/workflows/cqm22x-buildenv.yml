name: Build base image

# Publishes the public CQM22x build base image.
#
# The image contains no proprietary toolchain, so it is safe to build on a
# GitHub-hosted runner and publish publicly. The /pkg bundle is packaged and
# distributed separately (see cqm22x/pack-bundle.sh).

on:
  push:
    branches: [main]
    paths:
      - 'cqm22x/Dockerfile'
      - 'cqm22x/entrypoint.sh'
      - 'cqm22x/doctor.sh'
      - '.github/workflows/cqm22x-buildenv.yml'
  pull_request:
    paths:
      - 'cqm22x/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      push:
        description: 'Push to ghcr.io'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cavli-wireless-public/cqm22x-buildenv
  CONTEXT: cqm22x

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        # The image is ~2.5 GB and Python is built twice from source; the
        # default runner image leaves too little headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          load: true
          tags: cqm22x-buildenv:ci
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the environment contract
        # cqm-doctor's bundle and cache checks cannot pass without a mounted
        # /pkg, so only the image-side contract is asserted here: interpreters,
        # compiler, locale, shell and dtc output. Those are exactly the values
        # that silently changed build results in the previous setup.
        run: |
          docker run --rm cqm22x-buildenv:ci bash -c '
            set -e
            fail=0
            check() {
              if [ "$2" = "$3" ]; then printf "  PASS  %-22s %s\n" "$1" "$3"
              else printf "  FAIL  %-22s expected %s, got %s\n" "$1" "$2" "$3"; fail=1; fi
            }
            pyver() { "$1" -c "import platform;print(platform.python_version())" 2>/dev/null || echo missing; }
            check "python3"   3.8.12          "$(pyver python3)"
            check "python"    3.8.12          "$(pyver python)"
            check "python3.6" 3.6.9           "$(pyver python3.6)"
            check "python3.8" 3.8.12          "$(pyver python3.8)"
            check "gcc"       10.5.0          "$(gcc -dumpfullversion)"
            check "LANG"      en_US.UTF-8     "$LANG"
            check "/bin/sh"   bash            "$(basename "$(readlink -f /bin/sh)")"
            python3 -c "import ctypes" && printf "  PASS  %-22s\n" "python3 _ctypes" || { printf "  FAIL  python3 _ctypes\n"; fail=1; }
            check "kernel/prebuilts"  /pkg/prebuilts  "$(readlink -f /pkg/kernel/prebuilts)"
            exit $fail
          '

      - name: Verify dtc reproduces the reference fixture
        run: |
          docker run --rm cqm22x-buildenv:ci bash -c '
            cat > /tmp/ref.dts <<"DTS"
          /dts-v1/;
          / {
          	compatible = "cavli,cqm22x-buildenv-selftest";
          	#address-cells = <2>;
          	#size-cells = <2>;
          	model = "dtc reference fixture";
          	chosen { bootargs = "selftest"; };
          	memory@80000000 {
          		device_type = "memory";
          		reg = <0x0 0x80000000 0x0 0x10000000>;
          	};
          	soc {
          		#address-cells = <1>;
          		#size-cells = <1>;
          		ranges;
          		ref0: node@1000 {
          			compatible = "cavli,ref";
          			reg = <0x1000 0x100>;
          			str = "abc";
          			bytes = [00 11 22 33];
          			cells = <0xdeadbeef 1 2 3>;
          		};
          	};
          };
          DTS
            /pkg/qct/software/boottools/dtc -I dts -O dtb -o /tmp/ref.dtb /tmp/ref.dts
            echo "f97ab6a0c0a70458a18b83dcd2f86380aa46ba188fc5d5baaf6f5c435e20c2ed  /tmp/ref.dtb" | sha256sum -c -
          '

      - name: Report image size
        run: docker images cqm22x-buildenv:ci --format '{{.Size}}'

      - name: Push
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
